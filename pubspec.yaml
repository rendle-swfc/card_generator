name: card_generator
description: A Flutter Web application for building custom SWFC cards.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  file_picker: ^8.1.4
  file_saver: ^0.2.2
  flutter:
    sdk: flutter
  gal: ^2.3.3
  http: ^1.1.0
  http_parser: ^4.0.2
  path_provider: ^2.1.6
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/generator_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/frames/

  fonts:
    - family: CardFont
      fonts:
        - asset: assets/fonts/card_font.ttf
